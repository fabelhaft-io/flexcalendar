# JDK pin for the Android module of the Flutter app (E02-R02).
#
# Gradle's daemon JVM criteria: every build of this project runs on Java 21
# (LTS), whatever JDK happens to be on PATH. Gradle resolves a matching
# toolchain itself, so a clean checkout builds with the pinned tools and
# nothing else. Gradle >= 8.8 reads this file; the wrapper is pinned to 9.3.1
# (gradle/wrapper/gradle-wrapper.properties).
#
# The Android Gradle Plugin and Kotlin Gradle Plugin are *not* pinned here:
# E10-R01's Flutter scaffold sets them from the pinned Flutter release.
toolchainVersion=21
