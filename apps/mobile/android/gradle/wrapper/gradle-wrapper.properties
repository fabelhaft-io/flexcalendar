# Gradle wrapper for the Android module of the Flutter app (E02-R02).
#
# The Gradle distribution is pinned by version *and* by checksum, so a clean
# checkout downloads exactly this Gradle and nothing else. 9.3.1 is the version
# the pinned Flutter release supports (apps/mobile/.fvmrc). The JDK pin for the
# build lives in gradle/gradle-daemon-jvm.properties.
#
# Keep both pins in step when bumping: Gradle and JDK.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
