# Gradle wrapper for the Android module of the Flutter app (E02-R02).
#
# The Gradle distribution is pinned by version *and* by checksum, so a clean
# checkout downloads exactly this Gradle and nothing else. The JDK pin for the
# build lives in ../build.gradle.kts (Java toolchain 21); the Android Gradle
# Plugin and Kotlin plugin pins are in ../settings.gradle.kts.
#
# Keep all three in step when bumping: Gradle, JDK, AGP/Kotlin.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
