# Flutter toolchain + SDK pin (E02-R02). The app itself arrives with E10-R01 and
# grows its dependency list there; this file exists so a clean checkout refuses
# to build with anything but the pinned Flutter/Dart.
#
# Flutter 3.47.6 (stable, 2026-10-01) ships Dart 3.13.5. FVM reads `.fvmrc`
# next to this file; CI reads the same version from it (see `apps/mobile/README.md`).
name: calendar_flex
description: calendar-flex mobile app — Android first (minSdk 26), iOS from Phase 5 (ADR 0003).
publish_to: "none"

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6 <4.0.0"

dependencies:
  dio: 5.11.1
  retrofit: 4.10.0
  json_annotation: 4.12.0

dev_dependencies:
  swagger_parser: 1.45.0
  build_runner: 2.16.1
  retrofit_generator: 10.2.11
  json_serializable: 6.14.1
  test: 1.32.0
  # build_runner 2.16.1 uses an analyzer API removed in 14.x.
  analyzer: 13.3.0
