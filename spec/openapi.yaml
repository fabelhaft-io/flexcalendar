  # E05-R08. The delta: `sync-collection` (RFC 6578) proxied for our own
  # clients, which are the only callers that keep a cache to move forward. The
  # path is `/changes`, under the same `{calendarId}` parameter as the events
  # routes and for the same reason.
  /calendars/{calendarId}/changes:
    get:
      tags: [events]
      operationId: listCalendarChanges
      summary: List what changed since a token
      description: >-
        The incremental sync our own clients use. With no `since`, the whole
        collection is reported as present objects — the initial load; with one,
        only what changed since that token, a tombstone for each deletion.

        The answer is pointers, never content: a change is a `uid`, an `etag`
        and whether the object is gone. Fetch the object itself for its bytes.
        `etag` is absent on a tombstone, so a deletion can never be mistaken for
        a stale copy.

        `since` is an opaque token only this API mints: it names a point in one
        calendar's history and never leaves it. A value that is not one of ours,
        one minted for another calendar, and one that names a point the
        collection has never reached are all the same 410 — the client reloads
        fully, which is the only safe reading of a cursor that may have been
        skipped over. The response never echoes the token it refused.

        Roles are the reading roles: `owner`, `editor` and `viewer` all read,
        and a caller who is not a member gets the 404 an unknown id gets.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: path
          required: true
          description: The `calendars.id` uuid of the calendar.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: >-
            The `token` a previous answer to this operation returned, verbatim.
            Absent means the initial load, which reports the whole collection.
          schema:
            type: string
      responses:
        '200':
          description: The changes since `since`, and the token for them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarChanges'
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The issuer does not report the user's email as verified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            No calendar the caller is a member of has that id, which is also the
            answer for an id that exists nowhere
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: >-
            `since` is not a token this calendar can be read from: it is not one
            this API minted, it was minted for another calendar, or it names a
            point the collection has never reached. The client reloads fully by
            asking again without `since`. The body never names the token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Too many requests from this client address inside the window; the
            service answers again after `Retry-After`
          headers:
            Retry-After:
              description: Seconds until the client's allowance is restored.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected server-side failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The identity provider or the CalDAV service could not be read
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            No audience is configured yet, or the issuer has no usable signing
            keys
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: A CalDAV call ran past its deadline
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Zitadel-issued JWT access token (RS256, `iss` our issuer, `aud` the
        project ID). The API validates it against the issuer's JWKS and never
        introspects it.
  schemas:
    Health:
      type: object
      required: [status, service]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [api]
    User:
      type: object
      description: One `public.users` row; every field is a string.
      required: [id, handle, email]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The `users.id` uuid.
        handle:
          type: string
        email:
          type: string
    Calendar:
      type: object
      description: One calendar the caller is a member of. A Private calendar carries its sealed metadata envelope; the API never opens it (D-18).
      required:
        [id, mode, role, version, metaEnvelope, metaEpoch, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The `calendars.id` uuid, which is also the CalDAV collection href.
        mode:
          type: string
          description: The calendar mode. Until Phase 4 every calendar is `private` (ADR 0003).
        role:
          type: string
          description: "The caller's role in `calendar_members`: `owner`, `editor` or `viewer`."
        version:
          type: integer
          description: The optimistic-concurrency version; also the `ETag`.
        metaEnvelope:
          type: string
          description: "A Private calendar's client-sealed metadata envelope, standard base64. Opaque to the API."
        metaEpoch:
          type: integer
          description: "The CCK epoch inside the envelope's header."
        createdAt:
          type: string
          description: When the calendar was created, ISO 8601.
        updatedAt:
          type: string
          description: When the calendar last changed, ISO 8601.
    CalendarList:
      type: object
      description: The calendars the caller is a member of.
      required: [calendars]
      additionalProperties: false
      properties:
        calendars:
          type: array
          description: Oldest first. A Private calendar the caller cannot see is not listed.
          items:
            $ref: '#/components/schemas/Calendar'
    CalendarCreate:
      type: object
      description: >-
        A create request. `mode` is required and has no default (ADR 0001);
        until Phase 4 only `private` is accepted (ADR 0003). A Private calendar
        takes `metaEnvelope` and `metaEpoch` and no plaintext `name` or `color`
        (D-18). The API answers 422 for every rule of this list; a member the
        operation does not take is a 422 too.
      additionalProperties: false
      properties:
        mode:
          type: string
          description: The calendar mode. Until Phase 4, `private` is the only accepted value.
        metaEnvelope:
          type: string
          format: byte
          description: >-
            The client-sealed metadata envelope (version `0x01`, the CCK epoch
            as a big-endian uint32, a 24-byte nonce, ciphertext and a 16-byte
            tag), standard base64, at most 4096 bytes.
        metaEpoch:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: >-
            The CCK epoch the envelope's header carries. The header field is a
            uint32, but the API accepts only what `calendars.meta_epoch` holds
            (an `integer`); anything above it is a 422, never a database error.
        name:
          type: string
          description: >-
            A plaintext display name. Refused with 422 on a Private calendar
            (D-18); Shared calendars take one from Phase 4.
        color:
          type: string
          description: >-
            A plaintext colour. Refused with 422 on a Private calendar (D-18);
            Shared calendars take one from Phase 4.
    CalendarMeta:
      type: object
      description: >-
        A rename or recolour: it replaces the sealed envelope and the epoch it
        names, and it carries no plaintext `name` or `color` — those are a 422
        on a Private calendar (D-18), and so is any other member, `mode`
        included.
      additionalProperties: false
      properties:
        metaEnvelope:
          type: string
          format: byte
          description: >-
            The replacing metadata envelope, in the same layout and encoding as
            on create.
        metaEpoch:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: >-
            The CCK epoch the replacing envelope's header carries, in the same
            range as on create.
    EventTime:
      type: ['null', object]
      description: 'One event time. A write sends exactly one member: `date` (an all-day VALUE=DATE, `YYYY-MM-DD`) or `utc` (an instant, `YYYYMMDDTHHMMSSZ`). A read also answers `local` — the wall clock the object spells — with `tzid` beside it when the property names a zone; the API never converts a TZID time (E05-R09 owns zones). `null` when the object carries no such property.'
      additionalProperties: false
      properties:
        date:
          type: string
          description: 'An all-day date, `YYYY-MM-DD`.'
        utc:
          type: string
          description: 'A UTC instant, `YYYYMMDDTHHMMSSZ`.'
        tzid:
          type: string
          description: 'The `TZID` the stored property names, unchanged.'
        local:
          type: string
          description: 'The wall clock the stored property spells, `YYYYMMDDTHHMMSS`.'
    EventAlarm:
      type: ['null', object]
      description: 'The reminder: an ISO 8601 duration trigger, e.g. `-PT15M` for fifteen minutes before the start. `null` in a write removes it, and `null` in a read means the object carries none. The action and description are fixed (`ACTION:DISPLAY`, `DESCRIPTION:Reminder`).'
      additionalProperties: false
      required: [trigger]
      properties:
        trigger:
          type: string
          description: 'An ISO 8601 duration, e.g. `-PT15M`.'
    EventParsed:
      type: object
      description: 'The master VEVENT, parsed. No content and no override list: the raw `ical` beside it is the whole object.'
      required: [uid, start, end, rrule, alarm, sequence, envelopeSha256]
      additionalProperties: false
      properties:
        uid:
          type: string
          description: The master VEVENT `UID`, exactly as stored.
        start:
          $ref: '#/components/schemas/EventTime'
        end:
          $ref: '#/components/schemas/EventTime'
        rrule:
          type: ['null', string]
          description: 'The master `RRULE`, or null. Never written by a client.'
        alarm:
          $ref: '#/components/schemas/EventAlarm'
        sequence:
          type: integer
          description: 'The master `SEQUENCE`; 0 when the object carries none.'
        envelopeSha256:
          type: ['null', string]
          description: 'The `X-CALFLEX-ENVELOPE-SHA256` of the master VEVENT, 64 lowercase hex digits, or null when it carries none (a Shared calendar object).'
    Event:
      type: object
      description: 'One event: the raw iCalendar object the CalDAV collection stores (`ical`, byte for byte) and its `ETag`, plus a parsed convenience view. On a Private calendar the object is the skeleton, and the content lives in the sidecar (E13-R02).'
      required: [uid, etag, ical, parsed]
      additionalProperties: false
      properties:
        uid:
          type: string
          description: The `UID` of the stored object.
        etag:
          type: ['null', string]
          description: 'The CalDAV `ETag`, quoted, or null when the store answered without one.'
        ical:
          type: string
          description: 'The stored iCalendar object, byte for byte.'
        parsed:
          $ref: '#/components/schemas/EventParsed'
    EventCreate:
      type: object
      description: 'A create request. `start` is required; the API mints the `UID` and the `DTSTAMP`. On a Private calendar the content fields (`summary`, `description`, `location`, `attendees`) are a 422 and `envelopeSha256` is required — a Private object is a skeleton and the content lives in the sidecar (D-18, E03-R09). Any other member is a 422 as well.'
      additionalProperties: false
      required: [start]
      properties:
        start:
          $ref: '#/components/schemas/EventTime'
        end:
          $ref: '#/components/schemas/EventTime'
        rrule:
          type: ['null', string]
          description: 'The recurrence rule, in the RFC 5545 § 3.3.10 form: `FREQ` first, only the parts the RFC names and each at most once, `COUNT` or `UNTIL` but not both, `UNTIL` with the value type of the start, and neither `BYWEEKNO` nor a yearly rule on a 29 February start. Create only: a change to a recurring event is an intent (E05-R06/R07), never a rule a client writes.'
        alarm:
          $ref: '#/components/schemas/EventAlarm'
        envelopeSha256:
          type: ['null', string]
          description: 'The SHA-256 of the sealed content envelope, 64 lowercase hex digits. A Private VEVENT carries exactly one (E03-R09).'
        summary:
          type: ['null', string]
          description: 'The title. Refused with 422 on a Private calendar (D-18); Shared calendars take one from Phase 4.'
        description:
          type: ['null', string]
          description: 'The description. Refused with 422 on a Private calendar (D-18).'
        location:
          type: ['null', string]
          description: 'The location. Refused with 422 on a Private calendar (D-18).'
        attendees:
          type: ['array', 'null']
          description: 'The attendee addresses. Refused with 422 on a Private calendar (D-18).'
          items:
            type: string
    EventUpdate:
      type: object
      description: 'A patch request: the same fields as a create, minus `rrule`. Every member is optional; `null` removes the property it names and an absent member is left alone. An empty body is a 422, as are `uid`, `rrule` and any member naming a recurrence exception or an occurrence override — a recurring edit is an intent (E05-R06/R07), and the `UID` never changes (INV-05). `If-Match` is required (428 without it). On a Private calendar the content fields are a 422 (D-18).'
      additionalProperties: false
      properties:
        start:
          $ref: '#/components/schemas/EventTime'
        end:
          $ref: '#/components/schemas/EventTime'
        alarm:
          $ref: '#/components/schemas/EventAlarm'
        envelopeSha256:
          type: ['null', string]
          description: 'The SHA-256 of the re-sealed content envelope, 64 lowercase hex digits. A Private VEVENT carries exactly one (E03-R09).'
        summary:
          type: ['null', string]
          description: 'The title. Refused with 422 on a Private calendar (D-18).'
        description:
          type: ['null', string]
          description: 'The description. Refused with 422 on a Private calendar (D-18).'
        location:
          type: ['null', string]
          description: 'The location. Refused with 422 on a Private calendar (D-18).'
        attendees:
          type: ['array', 'null']
          description: 'The attendee addresses. Refused with 422 on a Private calendar (D-18).'
          items:
            type: string
    Change:
      type: object
      description: 'One changed object. It carries no event content: fetch the object itself for that.'
      required: [uid, deleted]
      additionalProperties: false
      properties:
        uid:
          type: string
          description: The `VEVENT` `UID`, read from the object the collection holds. A tombstone names the `uid` of the object that was removed.
        deleted:
          type: boolean
          description: '`true` for a tombstone — the object is gone, and the entry carries no `etag` — and `false` for an object the collection holds now.'
        etag:
          type: string
          description: The CalDAV `ETag` of a present object. Absent on a tombstone.
    CalendarChanges:
      type: object
      description: The changes since a token, and the token that stands for that point in the collection. With no `since`, the whole collection is reported as present objects.
      required: [token, changes]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The sync token to send back as `since` next time. Bound to this calendar; another calendar answers 410 for it.
        changes:
          type: array
          description: One entry per changed object, a tombstone for a deletion. Empty when nothing changed since `since`.
          items:
            $ref: '#/components/schemas/Change'
    Problem:
      type: object
      description: An RFC 9457 problem document. `type` is stable per kind; `title` is fixed copy; `instance` is `urn:uuid:<the request correlation ID>`.
      required: [type, title, status, instance]
      additionalProperties: false
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        instance:
          type: string
        property:
          type: string
        current:
          $ref: '#/components/schemas/Event'
