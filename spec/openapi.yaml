            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The issuer does not report the user's email as verified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            No calendar the caller is a member of has that id, or it holds no
            event under that `uid`, which is also the answer for an id or a
            `uid` that exists nowhere
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Too many requests from this client address inside the window; the
