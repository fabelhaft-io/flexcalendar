# API contract: generated clients and Fastify schemas must agree with this file.
openapi: 3.1.0
info:
  title: flexcalendar API
  version: 0.0.0
  license: { name: Apache-2.0, identifier: Apache-2.0 }
  description: >-
    API contract for the flexcalendar REST facade. Every operation except the
    readiness probe requires an OIDC access token from the D-03 IdP, sent as
    `Authorization: Bearer <JWT>` and validated locally against the IdP's
    JWKS: issuer, audience (the Zitadel project ID), expiry and not-before, and
    RS256 only. An opaque or malformed token is refused, never introspected.
    The token's `sub` maps to a `users` row, created on first sight from the
    issuer's own userinfo.

    Every error — an auth refusal, a rate-limit refusal, a validation failure
    or an unhandled fault — is an RFC 9457 problem document
    (`Content-Type: application/problem+json`, schema `Problem`). Nothing in it
    is derived from the request or from an exception message. Every response
    carries a correlation ID in `X-Request-Id`, the same ID that goes to CalDAV
    and appears in the server logs.

    Until Phase 4 every calendar is Private (ADR 0003). A Private calendar's
    name and colour exist only inside a client-sealed metadata envelope under
    the CCK (D-18): the API stores `metaEnvelope` opaquely in
    `calendars.meta_envelope`, gives the CalDAV collection the fixed display
    name `Private calendar`, and refuses a plaintext `name` or `color` with
    422. The API links no content-crypto library and never decrypts (INV-07).
servers:
  - url: https://api.flexcalendar.de
    description: production
  - url: https://api.staging.flexcalendar.de
    description: staging, created on demand
  - url: https://api.localhost:{port}
    description: local stack (CALFLEX_HTTPS_PORT)
    variables:
      port:
        default: '8443'
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Readiness probe
      description: >-
        Answers without a database, an identity provider or a token. The only
        operation that does.
      security: []
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me:
    get:
      tags: [users]
      operationId: getMe
      summary: The authenticated user
      description: >-
        The `users` row the access token's `sub` maps to. Created on first
        sight from the issuer's userinfo (`handle` from `preferred_username`,
        `email` from `email`, both after `email_verified`); a subject already
        in `users` is read back without another userinfo call.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: >-
            The request could not be parsed: a malformed body, a body that is
            not JSON, or a payload the schema refuses
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >-
            The issuer does not report the user's email as verified, or a
            Private calendar refused the write
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource, or no such operation on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The user's handle or email address is already taken
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The request body is larger than the service accepts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: The request body's media type is not supported
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Too many requests from this client address inside the window; the
            service answers again after `Retry-After`
          headers:
            Retry-After:
              description: Seconds until the client's allowance is restored.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected server-side failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The issuer's userinfo could not be read or contradicted the token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            No audience is configured yet, or the issuer has no usable signing
            keys
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /calendars:
    get:
      tags: [calendars]
      operationId: listCalendars
      summary: The caller's calendars
      description: >-
        Every calendar the caller is a member of, oldest first. A calendar the
        caller cannot see is not listed, and a Private calendar's name and
        colour are inside `metaEnvelope` — the API never opens one (D-18).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The calendars the caller is a member of
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarList'
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The issuer does not report the user's email as verified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The user's handle or email address is already taken
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Too many requests from this client address inside the window; the
            service answers again after `Retry-After`
          headers:
            Retry-After:
              description: Seconds until the client's allowance is restored.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected server-side failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The identity provider or the CalDAV service could not be read
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            No audience is configured yet, or the issuer has no usable signing
            keys
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [calendars]
      operationId: createCalendar
      summary: Create a calendar
      description: >-
        Requires an explicit `mode`; there is no default (ADR 0001). Until
        Phase 4 only `private` is accepted (ADR 0003), and a Private calendar
        is created with `metaEnvelope` and `metaEpoch` instead of a plaintext
        `name` or `color` (D-18). The API checks the envelope's header (version
        `0x01`, the CCK epoch that `metaEpoch` names, at least the 45 bytes of
        fixed fields) and its size (at most 4096 bytes), stores it opaquely, and
        gives the CalDAV collection the fixed display name `Private calendar`
        (E03-R09). The `calendars` row and the owner's `calendar_members` row
        are committed before the collection is made, and removed again if that
        fails. Every rule of this list is a 422, never a 400.

        The request body is validated by the route rather than by a schema: a
        schema-refused body is a 400, and the rules above must answer 422.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarCreate'
      responses:
        '201':
          description: The calendar and its CalDAV collection were created
          headers:
            Location:
              description: The created calendar's path, `/calendars/{id}`.
              schema:
                type: string
            ETag:
              description: The created calendar's version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          description: >-
            The request body is not well-formed JSON. A body that parses but is
            not a JSON object is a 422, not a 400
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The issuer does not report the user's email as verified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The user's handle or email address is already taken
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The request body is larger than the service accepts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: The request body's media type is not supported
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >-
            A rule of the operation was broken: the body is not a JSON object;
            `mode` is absent; `mode` is not `private`; `metaEnvelope` or
            `metaEpoch` is absent or not an envelope this service stores (a bad
            version byte, an epoch that disagrees with the header, more than
            4096 bytes, or an encoding that is not standard base64); a plaintext
            `name` or `color` was sent for a Private calendar; or the body
            carries a member the operation does not take. The body never names a
            value.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Too many requests from this client address inside the window; the
            service answers again after `Retry-After`
          headers:
            Retry-After:
              description: Seconds until the client's allowance is restored.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            An unexpected server-side failure; the calendar row is not left
            behind
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The identity provider or the CalDAV service could not be read
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            No audience is configured yet, or the issuer has no usable signing
            keys
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: A CalDAV call ran past its deadline
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  # The `id` path parameter is declared on each operation instead of once for the
  # whole path item: swagger_parser 1.45.0, the Dart generator E02-R07 pins,
  # casts every path-item member to a map before it skips `parameters`, so a
  # path-level list makes it die with a type error and `make gen` leaves
  # `apps/mobile/lib/api/` empty without failing. Keep `id` first in each
  # operation's list so the generated clients keep it as the leading argument.
  /calendars/{id}:
    patch:
      tags: [calendars]
      operationId: replaceCalendarMetadata
      summary: Rename or recolour a calendar
      description: >-
        A rename and a recolour are one act: both replace the sealed
        `metaEnvelope` and the `metaEpoch` it names. The request must carry
        `If-Match` with the version it read; a version that has moved on is a
        412, a missing `If-Match` a 428, and the CalDAV collection keeps the
        fixed display name `Private calendar` whatever the envelope holds
        (D-18). Only the owner may do it; a member who is not the owner gets a
        403, and a caller who is not a member a 404, exactly like an id that
        exists nowhere.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The `calendars.id` uuid.
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: The version the client read, quoted; `*` accepts any version.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarMeta'
      responses:
        '200':
          description: The calendar's metadata was replaced
          headers:
            ETag:
              description: The calendar's new version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          description: >-
            The request body is not well-formed JSON. A body that parses but is
            not a JSON object is a 422, not a 400
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >-
            The issuer does not report the user's email as verified, or the
            caller is a member of the calendar but not its owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            No calendar the caller is a member of has that id, which is also the
            answer for an id that exists nowhere
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The user's handle or email address is already taken
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The `If-Match` version is not the calendar's current version
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The request body is larger than the service accepts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: The request body's media type is not supported
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >-
            A rule of the operation was broken: the body is not a JSON object;
            `metaEnvelope` or `metaEpoch` is absent or not an envelope this
            service stores; a plaintext `name` or `color` was sent for a Private
            calendar; or the body carries a member the operation does not take,
            `mode` included. The body never names a value.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: >-
            The request carries no `If-Match`, so there is no version to be
            optimistic against
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Too many requests from this client address inside the window; the
            service answers again after `Retry-After`
          headers:
            Retry-After:
              description: Seconds until the client's allowance is restored.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected server-side failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The identity provider or the CalDAV service could not be read
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            No audience is configured yet, or the issuer has no usable signing
            keys
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: A CalDAV call ran past its deadline
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [calendars]
      operationId: deleteCalendar
      summary: Delete a calendar
      description: >-
        Removes the CalDAV collection and every row the calendar owns; the
        membership row cascades from the `calendars` row. Only the owner may do
        it; a member who is not the owner gets a 403, and a caller who is not a
        member a 404, exactly like an id that exists nowhere. A collection that
        is already gone is not an error: the request wanted it gone.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The `calendars.id` uuid.
          schema:
            type: string
      responses:
        '204':
          description: The collection and the calendar's rows are gone
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >-
            The issuer does not report the user's email as verified, or the
            caller is a member of the calendar but not its owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            No calendar the caller is a member of has that id, which is also the
            answer for an id that exists nowhere
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The user's handle or email address is already taken
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Too many requests from this client address inside the window; the
            service answers again after `Retry-After`
          headers:
            Retry-After:
              description: Seconds until the client's allowance is restored.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            An unexpected server-side failure; the collection is already gone, so
            a retry completes the delete
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The identity provider or the CalDAV service could not be read
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            No audience is configured yet, or the issuer has no usable signing
            keys
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: A CalDAV call ran past its deadline
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  # E05-R04. The calendar parameter is `calendarId`, not `id`: these paths carry
  # a `uid` beside it, and a generated client that took both as `id` would not
  # compile. Each operation declares its own parameters, for the reason given
  # above `/calendars/{id}`.
  /calendars/{calendarId}/events:
    post:
      tags: [events]
      operationId: createEvent
      summary: Create an event
      description: >-
        The client sends fields, never iCalendar: the API mints the `UID`
        (`crypto.randomUUID()`, INV-03) and the `DTSTAMP`, builds the object
        with `ical.js` and writes it with `If-None-Match: *`, so two creates
        cannot overwrite each other and a client never writes the recurrence
        itself — an exception or an occurrence override is an intent
        (E05-R06/R07, INV-05). The object name is `<uid>.ics`.

        The answer carries the raw iCalendar object (`ical`, byte for byte), the
        CalDAV `ETag` — also the `ETag` header — and a parsed convenience view of
        the master `VEVENT`. Until Phase 4 every calendar is Private (ADR 0003),
        so the object is a skeleton: `summary`, `description`, `location` and
        `attendees` are refused with 422 (they arrive with Shared calendars) and
        `envelopeSha256` is required, because a Private `VEVENT` carries exactly
        one `X-CALFLEX-ENVELOPE-SHA256` (E03-R09, D-18).

        The request body is validated by the route rather than by a schema: a
        schema-refused body is a 400, and every rule above must answer 422.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: path
          required: true
          description: The `calendars.id` uuid of the calendar to write into.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: The event was created
          headers:
            Location:
              description: The created event's path, `/calendars/{calendarId}/events/{uid}`.
              schema:
                type: string
            ETag:
              description: The created object's CalDAV `ETag`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: >-
            The request body is not well-formed JSON. A body that parses but is
            not a JSON object is a 422, not a 400
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >-
            The issuer does not report the user's email as verified, or the
            caller is a member of the calendar but cannot write into it (its
            role is `viewer`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >-
            The `UID` this request minted already names an object in the
            collection. A fresh UUIDv4 colliding can only mean another create
            won; the client retries
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The request body is larger than the service accepts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: The request body's media type is not supported
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >-
            A rule of the operation was broken: the body is not a JSON object;
            `start` is absent, or is not exactly one of `date`/`utc`, or names a
            time that does not exist; `end`, `rrule` or `alarm` is not a value
            the API can write — a rule part RFC 5545 does not name, `BYWEEKNO`,
            a yearly 29-February start, an `UNTIL` whose value type is not its
            start's, or an `end` that is not the same value type as its `start`
            or is not later than it; `envelopeSha256` is absent or is not 64
            lowercase hex digits; a content field (`summary`, `description`,
            `location`, `attendees`) was sent for a Private calendar; or the body
            carries a member the operation does not take — `uid` and the
            recurrence itself, an exception or an occurrence override included,
            which the API owns (INV-05). The body never names a value.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Too many requests from this client address inside the window; the
            service answers again after `Retry-After`
          headers:
            Retry-After:
              description: Seconds until the client's allowance is restored.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected server-side failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The identity provider or the CalDAV service could not be read
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            No audience is configured yet, or the issuer has no usable signing
            keys
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: A CalDAV call ran past its deadline
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /calendars/{calendarId}/events/{uid}:
    get:
      tags: [events]
      operationId: readEvent
      summary: Read one event
      description: >-
        Answers the object as the collection stores it — `ical` byte for byte,
        the CalDAV `ETag` (also the `ETag` header) and the parsed view of the
        master `VEVENT` — which is what a client caches as the canonical record
        (`docs/02` § Offline cache). An object with several `VEVENT`s (a master
        beside its overrides) is read whole; `parsed` describes the master and
        the `ical` carries the rest.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: path
          required: true
          description: The `calendars.id` uuid of the calendar.
          schema:
            type: string
        - name: uid
          in: path
          required: true
          description: >-
            The event's `UID`, a lowercase UUIDv4, exactly as the create
            answered it. Any other shape names no object and is a 404.
          schema:
            type: string
      responses:
        '200':
          description: The stored object and its parsed view
          headers:
            ETag:
              description: The object's CalDAV `ETag`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
