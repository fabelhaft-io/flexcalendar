# API contract: generated clients and Fastify schemas must agree with this file.
openapi: 3.1.0
info:
  title: calendar-flex API
  version: 0.0.0
  license: { name: Apache-2.0, identifier: Apache-2.0 }
  description: >-
    API contract for the readiness probe. E05 adds the product API.
servers:
  - url: https://api.flexcalendar.de
    description: production
  - url: https://api.staging.flexcalendar.de
    description: staging, created on demand
  - url: https://api.localhost:{port}
    description: local stack (CALFLEX_HTTPS_PORT)
    variables:
      port:
        default: '8443'
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required: [status, service]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [api]
