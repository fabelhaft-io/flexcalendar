          headers:
            Retry-After:
              description: Seconds until the client's allowance is restored.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected server-side failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: >-
            The identity provider or the CalDAV service could not be read, or
            the collection holds an object the API cannot describe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            No audience is configured yet, or the issuer has no usable signing
            keys
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: A CalDAV call ran past its deadline
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [events]
      operationId: updateEvent
      summary: Change an event
      description: >-
        The client sends the fields it wants changed and the `If-Match` it read.
        The API reads the stored object, applies the change with `ical.js`,
        bumps `SEQUENCE` and `DTSTAMP`, and `PUT`s with the same `If-Match`,
        which CalDAV checks — so a write that lost a race is a 412 and never an
        overwrite. The 412 carries the current representation in the problem's
        `current` member, and nothing of the request that lost.

        `rrule` and `uid` are refused with 422, and so is any member naming a
        recurrence exception or an occurrence override: an edit to a recurring
        event is an intent (E05-R06/R07), and a client never writes the
        recurrence itself (INV-05). A member that is `null` removes the property
        it names, and a body that carries no member at all is a 422 as well.
        Everything the change did not touch — an override component, a
        `VTIMEZONE`, an `X-` property — comes back unchanged (INV-02). On a
        Private calendar the content fields are a 422 (D-18).
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: path
          required: true
          description: The `calendars.id` uuid of the calendar.
          schema:
            type: string
        - name: uid
          in: path
          required: true
          description: The event's `UID`, a lowercase UUIDv4.
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: >-
            The object's `ETag`, as the read answered it. A list of validators
            and `*` are allowed; the store decides which of them matches.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: The object as it now stands
          headers:
            ETag:
              description: The object's new CalDAV `ETag`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: >-
            The request body is not well-formed JSON. A body that parses but is
            not a JSON object is a 422, not a 400
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >-
            The issuer does not report the user's email as verified, or the
            caller is a member of the calendar but cannot write into it (its
            role is `viewer`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            No calendar the caller is a member of has that id, or it holds no
            event under that `uid`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: >-
            The `If-Match` names an object the collection no longer holds: the
            change was made against a stale read. `current` carries the
            representation the collection holds now, and nothing of this request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The request body is larger than the service accepts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: The request body's media type is not supported
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >-
            A rule of the operation was broken: the body is not a JSON object;
            `rrule` or `uid` was sent, or a member naming a recurrence exception
            or an occurrence override, which the API owns (INV-05); a field is
            not a value the API can write — a rule part RFC 5545 does not name,
            `BYWEEKNO`, a yearly 29-February start, an `UNTIL` whose value type
            is not its start's, or an `end` that is not the same value type as
            its `start` or is not later than it; a content field was sent for a
            Private calendar; a `PATCH` carried no member at all; or the body
            carries a member the operation does not take. The body never names a
            value.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: >-
            The write carries no `If-Match`, so there is no version to be
            optimistic against
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Too many requests from this client address inside the window; the
            service answers again after `Retry-After`
          headers:
            Retry-After:
              description: Seconds until the client's allowance is restored.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected server-side failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: >-
            The identity provider or the CalDAV service could not be read, or
            the collection holds an object the API cannot describe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            No audience is configured yet, or the issuer has no usable signing
            keys
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: A CalDAV call ran past its deadline
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [events]
      operationId: deleteEvent
      summary: Delete an event
      description: >-
        Removes the object from the collection, conditioned on the `If-Match`
        the client read: a `DELETE` with a stale validator is a 412 and the
        object stays. The answer is 204 with no body. A `uid` the collection
        does not hold is a 404, whatever the validator says — Sabre looks the
        object up before it checks a precondition.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: path
          required: true
          description: The `calendars.id` uuid of the calendar.
          schema:
            type: string
        - name: uid
          in: path
          required: true
          description: The event's `UID`, a lowercase UUIDv4.
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: >-
            The object's `ETag`, as the read answered it. A list of validators
            and `*` are allowed; the store decides which of them matches.
          schema:
            type: string
      responses:
        '204':
          description: The object is gone
          content: {}
        '401':
          description: >-
            Missing, duplicated, malformed, opaque, expired, wrongly addressed
            or otherwise unverifiable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >-
            The issuer does not report the user's email as verified, or the
            caller is a member of the calendar but cannot write into it (its
            role is `viewer`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            No calendar the caller is a member of has that id, or it holds no
            event under that `uid`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: The method is not allowed on this path
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: >-
            The `If-Match` names an object the collection no longer holds, so
            nothing was deleted. `current` carries the representation the
            collection holds now
          content:
            application/problem+json:
