# TypeScript packages of the monorepo (D-09: "pnpm workspaces for TS").
#
# pnpm 12 reads every non-auth setting from this file; a committed `.npmrc` is
# only consulted for registry and auth settings (https://pnpm.io/settings), so
# the pnpm settings live here next to the workspace globs.
#
# Only directories that exist as a package today are listed by path; the globs
# pick up packages that are still README-only (`packages/crypto-ts`,
# `packages/api-client-ts`, `apps/web`), which pnpm skips until they get a
# package.json.
packages:
  - "server/api"
  - "apps/web"
  - "packages/*"

# Add dependencies pinned to an exact version; upgrades arrive as Renovate PRs,
# never as a silent minor bump.
saveExact: true

# Fail the install when a dependency's `engines` excludes our pinned Node (see
# `.nvmrc` and `package.json#engines`). The runtime pin itself is enforced by
# `package.json#devEngines`.
engineStrict: true
