name: Human approval
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  pull-requests: read
concurrency:
  group: human-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    # This stable name is a branch-protection check on main, next to
    # "Verify required". It is cheap on purpose: it re-runs on every label
    # change, which verify.yml must not.
    name: Human approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail while the agent+review label is on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Read the current labels, not the event payload: a re-run of this
          # job replays the old payload.
          labels=$(gh api "repos/$REPO/pulls/$PR" --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,agent+review,*)
              echo "::error::agent+review: a human must approve this PR. Remove the label once you have reviewed it."
              exit 1
              ;;
          esac
          echo "No agent+review label."
